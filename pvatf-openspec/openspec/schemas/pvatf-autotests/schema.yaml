# Версия пакета pvatf-openspec: 0.3.3
# Схема для отдельного проекта автотестов на фрейме PVATF. Одна основная схема на проект.
# Вид изменения - ключ `x-pvatf-kind` в .openspec.yaml изменения (autotest, ...).
# Содержимое артефактов пишет скрипт os_artifacts.py из рабочих файлов изменения
# (openspec/changes/<имя>/outputs/), модель артефакты руками не пишет и не правит.
name: pvatf-autotests
version: 1
description: PVATF - автотест по тест-кейсу из TMS - proposal -> tc -> design -> tasks -> apply
artifacts:
  - id: proposal
    generates: proposal.md
    description: Зачем, сценарий ТК, что меняется, критерии приёмки, вне scope, допущения
    template: proposal.md
    instruction: |
      Не пиши файл сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/autotest-plan/scripts/os_artifacts.py proposal <имя изменения>
      Код 0 -> покажи пользователю строки вывода «ИТОГ» и «ФАЙЛ».
      Код 1 -> покажи строки «НУЖНО» и сделай то, что в них написано, потом запусти снова.
      Код 2 -> покажи вывод и остановись.
      Скрипт пишет разделы из TC.md и проверки ТК: Зачем, Тест-кейс, Сценарий (шаги ТК дословно),
      Предусловия и данные, Что меняется, Критерии приёмки (команды и ожидаемые строки), Вне scope,
      Допущения (находки TC-n, которые не блокируют).
      Нельзя: дописать proposal.md руками, добавить шаг или проверку, которых нет в ТК.
      Нужно: только вывод скрипта.
    requires: []
  - id: tc
    generates: "tc/*.md"
    description: Тест-кейс из TMS и его проверка (TC-n)
    template: tc.md
    instruction: |
      Не пиши файлы сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/autotest-plan/scripts/os_artifacts.py tc <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ».
      Код 1 -> тест-кейс FAIL по проверке TC-n: покажи строки «НАХОДКА» пользователю и
      остановись - ТК правит автор в TMS, автотест по FAIL не пишется.
      Код 2 -> покажи вывод и остановись.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: План автотеста - шаги, окружение, файлы, методы, проверки, настройки, привязка к коду, планируемые изменения
    template: design.md
    instruction: |
      Файл создаёт скрипт, целиком его не пиши. Руками правишь только строки, которые называет
      вывод скрипта (ПРОВЕРИТЬ, ПРОБЛЕМА). Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/autotest-plan/scripts/os_artifacts.py design <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ».
      design.md - это план автотеста (шаги, G, константы, окружение под ТК); первый запуск
      строит его скриптом tc_plan.py.
      design.md - договор: разделы 11-14 (файлы, методы шагов, проверки, настройки) решают, что,
      куда и как пишется в код, раздел 14а «Реализация по G» - текстом по каждой G: что делает,
      где, как на фрейме по пунктам с [основанием], почему так, чего не делать (генератор пишет
      код по этому тексту); клетки ЗАПОЛНИТЬ - по references/design-rules.md скилла
      autotest-plan. Код пишется только после «да» человека на эти разделы (tc_plan.py approve).
      Разделы 15 (привязка шагов ТК к коду) и 16 (планируемые изменения: [ADDED] / [MODIFIED],
      файл, пакет, сигнатуры методов, параметры и их источник, проверки, аналог, порядок) пишет
      tc_plan.py validate из разделов 2-14. Руками их не правь: неверно - исправь строку
      раздела 11-14, validate перепишет 15-16.
      Подтверждение человека - на разделы 11-16 целиком, показать их таблицами как есть.
      Код 1 -> сделай то, что в строках «НУЖНО»: разбор артефактов агентом pvatf-artifacts
      (шаг 1б скилла autotest-plan), вопрос человеку об архитектуре steps / flow (шаг 1в),
      знакомство с технологиями - обзор документации и образцы проекта-примера (шаг 4б: все строки
      «НУЖНО: знакомство» за один круг), исправить в design.md строки ПРОВЕРИТЬ или ПРОБЛЕМА
      (шаги 5-7) или настроить окружение (скилл env-check, режим setup с ключом ТК), потом этот
      скрипт снова. Не больше 3 кругов.
      Код 2 -> покажи вывод и остановись.
    requires:
      - tc
  - id: tasks
    generates: tasks.md
    description: Группы задач apply - группа на шаг генерации G-n, задача на каждый файл, метод, проверку и настройку плана
    template: tasks.md
    instruction: |
      Не пиши файл сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/autotest-plan/scripts/os_artifacts.py tasks <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ». Код 1 или 2 -> покажи вывод и остановись.
      В группе G-n: задача-задание агенту, затем по задаче на каждую строку разделов 11-14 этой G
      со ссылкой (design.md:<строка>): создать или дополнить файл, метод с сигнатурой, проверка
      поля, ключ настройки; последняя задача группы - `at_tools.py compile <ключ> <G-n>`
      (компиляция командой из ENV.json) -> КОМПИЛЯЦИЯ: ok. Чекбоксы ставит sync по коду: файл есть, метод объявлен, поле
      проверяется, ключ в файле. Задач сверх плана нет; новая задача - только через правку плана.
    requires:
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Ты выполняешь задачи tasks.md по design.md. Ты не автор дизайна.

    Перед первой группой и после каждого пополнения конспекта документации запусти:
      python3 .gigacode/skills/autotest-gen/scripts/at_tools.py rules <ключ ТК>
    (пишет rules-now.md и docs-now.md, которые читает агент).
    Режим всегда subagents: каждую группу `## G-n` выполняет сабагент-исполнитель
    pvatf-generator по брифу, ты код не пишешь. Бриф группы печатает скрипт:
      python3 .gigacode/skills/autotest-gen/scripts/at_tools.py next <ключ ТК>
    Вывод после строки «ЗАДАНИЕ для агента pvatf-generator» передай агенту дословно.
    Ответ агента - строка `Статус:`, по таблице:
    - ok -> `at_tools.py mark <ключ> <G-n> ok`, затем последняя задача группы: `at_tools.py compile
      <ключ> <G-n>` (компиляция тестов командой из ENV.json). К следующей группе - только после
      `КОМПИЛЯЦИЯ: ok`;
    - stub -> `at_tools.py mark <ключ> <G-n> stub`, компиляцию этой G не запускаешь, следующая группа;
    - blocked -> `mark <ключ> <G-n> blocked`. Строка `СТОП: ... в плане не хватает` (агент написал
      «Причина: план - ...») -> документацию не спрашиваешь, stub не ставишь: вопрос человеку из
      строки СТОП, правка design.md и новое «да» (os_work.py next даст `правка плана`). Иначе -
      вопросы документации агенту pvatf-docs (правило 3 autotest-rules.md), `at_tools.py rules`,
      потом `mark <ключ> <G-n> todo`, `next` - задание агенту снова; не больше 2 кругов, потом
      `mark <ключ> <G-n> stub`.
    КОМПИЛЯЦИЯ: failed -> `at_tools.py mark <ключ> <G-n> todo`, `next`, задание агенту дословно
    (ошибки скрипт вписал в раздел ИСПРАВЬ), `mark ... ok`, снова compile; не больше 2 кругов, потом
    `mark <ключ> <G-n> stub` (скрипт сам заменит код G в тест-классе строкой STUB).
    КОМПИЛЯЦИЯ: timeout -> compile ещё раз; снова timeout - `mark <ключ> <G-n> stub`.
    КОМПИЛЯЦИЯ: заглушки -> сборка упала только в файлах G stub и manual (их код пишет человек): эта G
    готова, ошибки уйдут человеку, дальше следующая группа.
    «нет команды компиляции» -> скилл env-check, режим check, потом снова compile.
    Чекбоксы tasks.md ставит скрипт по статусам G и по коду (файл, метод, проверка, ключ); руками
    чекбоксы не ставишь:
      python3 .gigacode/skills/autotest-plan/scripts/os_artifacts.py sync <имя изменения>

    После всех групп: `at_tools.py assemble <ключ>`, затем `at_tools.py check <ключ>`.
    Находки check: строка `НУЖНО: <G-n> - находок в классах шагов` -> `mark <ключ> <G-n> todo`,
    `next`, агент (находки уже в задании), `mark ... ok`, compile, assemble, снова check; находки
    тест-класса - по references/generation.md скилла autotest-gen через фрагменты; не больше 3
    кругов. `ИТОГ: ... только строки STUB` -> не исправляешь, тест не запускается, итог с заглушками
    человеку (os_work.py next даст вопрос «допишете код сами или архивировать как есть»). Строки
    `ЧЕЛОВЕК` - находки в коде, который дописал человек: не исправляешь, итог человеку.
    Человек дописал заглушку -> `at_tools.py accept <ключ>` (код в фрагменты, статус manual), потом
    check; assemble после этого не стирает код человека. `assemble`: `ИЗМЕНЁН ВРУЧНУЮ` -> тест-класс
    правили после сборки: человек - accept; ты - перенеси правку во фрагмент и `assemble --force`.
    Последняя задача всегда - запуск: `at_tools.py run <ключ>` сразу после чистого check, без
    вопроса человеку (скилл autotest-gen, шаги 7-9). Без запуска изменение не архивируется; без
    passed (заглушки, тест не прошёл) - только по слову человека «архивировать».
    Задача запуска отмечается только при РЕЗУЛЬТАТ: passed. Не прошёл -> шаг 8 autotest-gen:
    КОД - исправить по шагу 8 (тест-класс - через фрагмент, класс шагов - агент), check, снова run
    (не больше 2 кругов); СТЕНД, ПРОВЕРКА - отчёт RUN.md человеку и вопрос «исправить и запустить
    снова или архивировать как есть».

    Правило происхождения: каждая правка - строка design.md, раздел 16 «Планируемые изменения».
    Тест-класс - только по пути test_file из шапки design.md (его собирает assemble); классы шагов
    и файлы данных создаёт и меняет только агент по заданиям G раздела 3; файла или метода нет в
    разделе 16 - не трогать, другие файлы проекта не трогать. Задача группы осталась без отметки
    после `mark ... ok` и `КОМПИЛЯЦИЯ: ok` - агент её не сделал: `at_tools.py mark <ключ> <G-n> todo`,
    `next`, в конец задания - строка задачи дословно; не больше 2 кругов, потом stub.
    Запрещено: ослаблять проверки, писать в код пустую или фиктивную реализацию ради зелёной сборки
    (заглушка - только командой `mark ... stub`), писать или править код классов шагов самому,
    ставить чекбоксы tasks.md руками, спрашивать «архивировать или запустить» вместо запуска.
    Расхождение design и проекта (класса нет, сигнатура другая) - СТОП, покажи человеку:
      Симптом: <ошибка> · Задача: tasks.md:<N> · Design: design.md:<M> · Что менять: <артефакт>
