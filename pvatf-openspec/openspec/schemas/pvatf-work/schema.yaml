# Версия пакета pvatf-openspec: 0.3.3
# Схема для работ набора PVATF кроме автотеста по ТК: миграция, окружение, обновление фрейма,
# ревью автотеста, разметка, зависимости (проверка ТК - схема pvatf-autotests с остановкой после tc). Вид работы - ключ `x-pvatf-kind`
# в .openspec.yaml изменения. Артефакты пишет скрипт os_work.py, модель их руками не пишет.
name: pvatf-work
version: 1
description: PVATF - работа набора (миграция, окружение, фрейм, ревью) - proposal -> design -> tasks -> apply
artifacts:
  - id: proposal
    generates: proposal.md
    description: Что делаем и зачем
    template: proposal.md
    instruction: |
      Не пиши файл сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/de-pvatf-orchestrator/scripts/os_work.py proposal <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ». Код 1 -> сделай то, что в строках «НУЖНО», и
      запусти снова. Код 2 -> покажи вывод и остановись.
    requires: []
  - id: design
    generates: design.md
    description: Состояние проекта и план работ по данным скиллов набора
    template: design.md
    instruction: |
      Не пиши файл сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/de-pvatf-orchestrator/scripts/os_work.py design <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ».
      Код 1 -> строки «НУЖНО» называют скилл, который подготовит данные. Запусти этот скилл
      по его SKILL.md, потом этот скрипт снова. Вид migration: design.md изменения - это карта
      миграции, её пишет скилл de-pvatf-migration-map по этапам (несколько чатов) и утверждает человек;
      скрипт только проверяет, что карта утверждена. Код 2 -> покажи вывод и остановись.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Задачи apply - каждая называет скилл набора и что он делает
    template: tasks.md
    instruction: |
      Не пиши файл сам. Запусти (таймаут 600 секунд):
        python3 .gigacode/skills/de-pvatf-orchestrator/scripts/os_work.py tasks <имя изменения>
      Код 0 -> покажи строки «ИТОГ» и «ФАЙЛ». Код 1 или 2 -> покажи вывод и остановись.
    requires:
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Ты выполняешь задачи tasks.md по порядку групп. Ты не автор плана.

    Каждая задача называет скилл набора и что передать ему - например «скилл de-pvatf-migration-step,
    юнит M-007». Открой SKILL.md этого скилла и выполни его шаги ровно для этой задачи.
    Скилл закончил по своему контракту (его итог без ошибок) -> отметь задачу `- [x]`
    (миграция: статус юнита в карте ставит de-pvatf-migration-step, чекбокс отметит
    `python3 .gigacode/skills/de-pvatf-orchestrator/scripts/os_work.py sync <имя изменения>`).
    Скилл остановился (вопрос человеку, блокер, FAIL) -> задачу не отмечай, покажи итог
    скилла человеку и остановись.

    Одна задача с правкой кода на чат, если скилл так требует (de-pvatf-migration-step: один юнит на
    чат). После такой задачи скажи человеку: «Задача <N> готова. Новый чат: /opsx-de-pvatf
    продолжи <имя изменения>».

    Запрещено: работа вне задач tasks.md, правка tasks.md кроме чекбоксов, пропуск задачи.
