# Конфиг OpenSpec для отдельного проекта автотестов на PVATF.
# Скопируйте в openspec/config.yaml проекта и поправьте context под проект.
schema: pvatf-autotests

context: |
  Проект автотестов на фрейме PVATF (Java, Maven или Gradle, JUnit 5 / TestNG / Spring).
  Тест-кейсы - в TMS, загружаются через MCP по ключу.
  Работы набора: автотест по ТК (схема pvatf-autotests), остальное - схема pvatf-work
  (os_work.py создаёт изменение с нужной схемой сам).

rules:
  design:
    - Имена классов и методов фрейма - только из документации фрейма (агент pvatf-docs), не по памяти.
  tasks:
    - Запуск теста на стенде - последняя задача apply, без вопроса человеку; без запуска изменение не архивируется.
